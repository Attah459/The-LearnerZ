spring.application.name=primary-app

# Database Configuration Engine
spring.datasource.url=jdbc:h2:mem:thelearnerz_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Persistence Mapping Strategy
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Strict Structural Template Resolution Mappings
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false

# Declarative Application Account Directory Configurations
spring.security.user.name=student@learnerz.com
spring.security.user.password=student123
spring.security.user.roles=STUDENT
