<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | The LearnerZ</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .login-card { border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05); border: none; }
        .form-control { border-radius: 10px; padding: 12px; border: 1px solid #cbd5e1; }
        .form-control:focus { box-shadow: 0 0 0 4px rgba(59,130,246,0.1); border-color: #3b82f6; }
    </style>
</head>
<body class="d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark">🎓 The LearnerZ</h2>
                    <p class="text-muted small">Access your localized educational platform</p>
                </div>
                
                <div class="card login-card bg-white p-4">
                    <h4 class="fw-bold mb-4 text-slate-800">Account Login</h4>
                    
                    <div th:if="${param.error}" class="alert alert-danger rounded-3 py-2.5 small mb-3 border-0" style="background-color: #fef2f2; color: #991b1b;">
                        ⚠️ Invalid email address or password.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success rounded-3 py-2.5 small mb-3 border-0" style="background-color: #f0fdf4; color: #166534;">
                        ✓ Logged out successfully.
                    </div>

                    <form th:action="@{/login}" method="POST">
                        <div class="mb-3">
                            <label class="form-label small fw-medium text-secondary">Email Address</label>
                            <input type="text" name="username" class="form-control" placeholder="name@learnerz.com" required autocomplete="off">
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-medium text-secondary">Account Password</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-3 fw-semibold shadow-sm">Sign Into Portal</button>
                    </form>
                </div>
                
                <div class="text-center mt-4">
                    <a th:href="@{/home}" class="text-decoration-none small text-secondary fw-medium">← Back to Public Portal</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
